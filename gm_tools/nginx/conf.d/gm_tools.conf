# ========================================
# Nginx 虚拟主机配置
# DNF GM工具 - HTTPS + 反向代理
# Week 3 基础设施配置
# ========================================

# ========================================
# HTTP -> HTTPS 重定向
# ========================================

server {
    listen 80;
    server_name gm.dnf.game;

    # ACME Challenge (Let's Encrypt证书申请)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他所有请求重定向到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ========================================
# HTTPS 主配置
# ========================================

server {
    listen 443 ssl http2;
    server_name gm.dnf.game;

    # ========================================
    # SSL证书配置
    # ========================================

    # SSL证书文件路径
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL协议版本
    ssl_protocols TLSv1.2 TLSv1.3;

    # SSL加密套件（优先使用强加密）
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # SSL会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling（证书状态在线检查）
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HSTS (强制HTTPS访问，有效期1年)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========================================
    # 日志配置
    # ========================================

    access_log /var/log/nginx/gm_access.log api_log;
    error_log /var/log/nginx/gm_error.log warn;

    # ========================================
    # 前端静态资源（React）
    # ========================================

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（React Router）
    location / {
        try_files $uri $uri/ /index.html;

        # 缓存策略
        expires -1;  # HTML不缓存（实时更新）
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # 后端API反向代理
    # ========================================

    location /api/ {
        # 限流（每秒10个请求，突发20个）
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # 代理到后端服务
        proxy_pass http://gm_tools_backend/;

        # 代理Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 禁用缓冲（实时响应）
        proxy_buffering off;

        # 允许大请求体（用于物品赠送等操作）
        client_max_body_size 10m;

        # CORS（如果需要）
        # add_header Access-Control-Allow-Origin * always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    # ========================================
    # 健康检查端点
    # ========================================

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ========================================
    # 监控端点（仅内网访问）
    # ========================================

    location /nginx_status {
        stub_status on;
        access_log off;

        # 限制IP访问（仅允许内网）
        allow 172.28.0.0/16;  # Docker网络
        allow 127.0.0.1;
        deny all;
    }

    # ========================================
    # 禁止访问敏感文件
    # ========================================

    # 禁止访问.开头的隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========================================
    # 错误页面
    # ========================================

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ========================================
# 配置说明
# ========================================

# 1. SSL证书路径：
#    - Let's Encrypt: /etc/letsencrypt/live/gm.dnf.game/
#    - 自签名证书: /etc/nginx/ssl/
#
# 2. 证书申请（Let's Encrypt）：
#    sudo certbot certonly --webroot -w /var/www/certbot -d gm.dnf.game
#
# 3. 证书自动续期：
#    0 2 1 * * certbot renew --quiet && systemctl reload nginx
#
# 4. 测试配置：
#    nginx -t
#
# 5. 重新加载配置：
#    nginx -s reload
