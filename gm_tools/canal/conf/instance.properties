# ========================================
# Canal Instance 配置
# DNF GM工具 - 数据同步配置
# Week 3 基础设施配置
# ========================================

# ========================================
# 1. 源数据库配置（生产MySQL）
# ========================================

# 生产数据库地址
canal.instance.master.address=${PRODUCTION_DB_HOST}:${PRODUCTION_DB_PORT}

# Canal同步用户（由DBA创建，具有REPLICATION权限）
canal.instance.dbUsername=${CANAL_DB_USER}
canal.instance.dbPassword=${CANAL_DB_PASSWORD}

# 连接字符集
canal.instance.connectionCharset=UTF-8

# 默认数据库
canal.instance.defaultDatabaseName=taiwan_cain

# ========================================
# 2. 同步规则配置
# ========================================

# 同步哪些表（正则表达式）
# 格式：数据库名\\.表名
# .*\\..* 表示所有库所有表
# taiwan_cain\\.charac_.* 表示taiwan_cain库的所有charac_开头的表

canal.instance.filter.regex=\
taiwan_cain\\.charac_info,\
taiwan_cain\\.charac_warehouse,\
taiwan_cain\\.charac_equip,\
taiwan_cain\\.charac_quest,\
taiwan_cain\\.member_info,\
taiwan_cain\\.member_punish_info,\
taiwan_login\\.member_login_log

# 不同步哪些表（黑名单，一般留空）
canal.instance.filter.black.regex=

# ========================================
# 3. binlog配置
# ========================================

# binlog格式（必须为ROW）
canal.instance.binlog.format=ROW

# binlog镜像（建议为FULL，可以获取UPDATE前后的完整数据）
canal.instance.binlog.image=FULL

# ========================================
# 4. 位点管理
# ========================================

# binlog位点持久化方式
# meta - 保存到meta.dat文件
# zookeeper - 保存到ZooKeeper（集群模式）
canal.instance.meta.manager.type=meta

# meta文件保存路径
canal.instance.meta.data.dir=/home/admin/canal-server/conf/${canal.instance.destination:}/meta

# ========================================
# 5. 目标配置（输出到哪里）
# ========================================

# 输出模式：tcp（默认，Canal客户端消费）/ kafka / rocketmq
canal.instance.tsdb.enable=false

# 使用自定义适配器输出到MySQL镜像数据库
# 通过Canal Client消费binlog后写入镜像库

# ========================================
# 6. 性能配置
# ========================================

# 单次批量获取的binlog事件数量
canal.instance.memory.batch.size=1024

# binlog流处理缓冲区大小（字节）
canal.instance.memory.buffer.size=16384

# 是否使用druid解析SQL（提升性能）
canal.instance.parser.parallel=true
canal.instance.parser.parallelThreadSize=4

# ========================================
# 7. 故障恢复配置
# ========================================

# 心跳检测（秒）
canal.instance.detecting.enable=true
canal.instance.detecting.sql=SELECT 1

# 心跳间隔（秒）
canal.instance.detecting.interval.time=3

# binlog位点记录间隔（秒）
canal.instance.meta.flush.interval=1000

# ========================================
# 8. GTID配置（如果生产库启用了GTID）
# ========================================

# 是否启用GTID
canal.instance.gtid.enable=false

# ========================================
# 9. 监控配置
# ========================================

# 是否开启Prometheus监控
canal.instance.metrics.enable=true

# ========================================
# 10. 数据库字段映射（可选）
# ========================================

# 时区配置
canal.instance.timezone=Asia/Shanghai

# ========================================
# 11. 高可用配置（可选，初期单机部署可忽略）
# ========================================

# 是否启用HA
canal.instance.ha.enable=false

# ========================================
# 配置说明
# ========================================

# 注意事项：
# 1. ${PRODUCTION_DB_HOST} 等变量会从环境变量中读取
# 2. DBA必须先在生产数据库执行以下操作：
#    - 开启binlog：log-bin=mysql-bin
#    - 设置binlog格式：binlog_format=ROW
#    - 创建同步用户并授权：GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.*
# 3. 首次启动Canal会从当前binlog位置开始同步（不会同步历史数据）
#    需要先执行全量同步，再启动Canal增量同步
# 4. Canal会自动记录binlog位点到meta.dat，重启后从上次位置继续
