# ========================================
# Canal Server 主配置
# DNF GM工具 - 数据同步配置
# Week 3 基础设施配置
# ========================================

# ========================================
# 1. Canal Server基础配置
# ========================================

# Canal Server ID（集群模式下每个节点唯一）
canal.id=1

# Canal Server IP（留空则自动检测）
canal.ip=

# Canal Server端口
canal.port=11111

# Canal Metrics端口（Prometheus监控）
canal.metrics.pull.port=11112

# ========================================
# 2. Instance配置
# ========================================

# 默认启用的instance列表（逗号分隔）
# example为默认instance名，可以创建多个instance同步不同的库
canal.destinations=dnf_gm_sync

# 自动扫描instance配置目录
canal.auto.scan=true
canal.auto.scan.interval=5

# ========================================
# 3. 数据存储配置
# ========================================

# instance配置模式
# manager - 通过Canal Admin管理（推荐生产环境）
# spring - 通过Spring配置
canal.instance.global.spring.xml=classpath:spring/default-instance.xml

# ========================================
# 4. ZooKeeper配置（集群模式）
# ========================================

# 是否启用ZooKeeper
canal.zkServers=

# ========================================
# 5. 持久化配置
# ========================================

# meta数据存储方式
# local_file - 本地文件（单机模式）
# zookeeper - ZooKeeper（集群模式）
canal.instance.global.mode=spring

# 本地meta文件存储路径
canal.file.data.dir=/home/admin/canal-server/conf
canal.file.flush.period=1000

# ========================================
# 6. 性能配置
# ========================================

# 是否启用内存优化
canal.instance.memory.optimize=true

# 缓冲区大小
canal.instance.memory.buffer.size=16384
canal.instance.memory.buffer.memunit=1024

# ========================================
# 7. 日志配置
# ========================================

# 日志级别
canal.instance.global.log.level=INFO

# ========================================
# 8. 网络配置
# ========================================

# Socket超时时间（毫秒）
canal.socketChannel.readTimeout=90000

# ========================================
# 9. 告警配置（可选）
# ========================================

# 告警邮件配置（留空则不发送）
canal.alarmHandler=

# ========================================
# 10. 管理端口（可选）
# ========================================

# Canal Admin配置（如果使用Admin管理）
canal.admin.manager=
canal.admin.port=11110
canal.admin.user=admin
canal.admin.passwd=4ACFE3202A5FF5CF467898FC58AAB1D615029441

# ========================================
# 配置说明
# ========================================

# 1. 这是Canal Server的主配置文件
# 2. Instance的具体配置在 conf/${instance_name}/instance.properties
# 3. 初期使用单机模式，ZooKeeper相关配置留空
# 4. 监控通过Prometheus拉取 http://localhost:11112/metrics
