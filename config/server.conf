# DNF Game Server - Main Configuration
# Core server settings and module parameters

[Server]
# Server name/identifier
server_name = DNF Game Server

# Server version
version = 0.1.0

# Server listening port
port = 7600

# Bind IP address (0.0.0.0 for all interfaces)
bind_address = 0.0.0.0

# Maximum concurrent connections
max_connections = 10000

# Worker threads
worker_threads = 4

# Enable daemon mode (background process)
daemon_mode = no

# PID file location
pid_file = /var/run/df_game_server.pid

[Network]
# TCP receive buffer size (bytes)
tcp_recv_buffer = 65536

# TCP send buffer size (bytes)
tcp_send_buffer = 65536

# TCP keep-alive interval (seconds)
tcp_keepalive = 60

# Connection timeout (seconds)
connection_timeout = 30

# Maximum packet size (bytes)
max_packet_size = 65536

# Enable packet compression
enable_compression = yes

# Compression threshold (bytes)
compression_threshold = 1024

[User Management]
# Maximum concurrent users
max_users = 5000

# Character selection timeout (seconds)
character_select_timeout = 60

# AFK (away from keyboard) timeout (seconds)
afk_timeout = 600

# Disconnect idle users
disconnect_idle_users = yes

# Idle timeout before disconnect (seconds)
idle_disconnect_timeout = 1800

[Inventory]
# Maximum inventories (should match max_users)
max_inventories = 5000

# Default inventory slots per user
default_inventory_slots = 90

# Maximum inventory expansion
max_inventory_slots = 200

# Warehouse shared across characters
shared_warehouse = yes

# Warehouse slots
warehouse_slots = 120

[Events]
# Maximum pending events in queue
max_pending_events = 1000

# Maximum event listeners
max_event_listeners = 100

# Event processing batch size
event_batch_size = 50

# Event processing interval (milliseconds)
event_process_interval = 100

[Security]
# Enable anti-cheat system
enable_anticheat = yes

# Packet validation strictness: low, medium, high
packet_validation = high

# Enable speed hack detection
speed_hack_detection = yes

# Enable memory editing detection
memory_edit_detection = yes

# GM (Game Master) command logging
gm_command_logging = yes

# IP blacklist update interval (seconds)
blacklist_update_interval = 300

[Performance]
# Server tick rate (ticks per second)
server_tick_rate = 20

# Maximum CPU usage target (%)
max_cpu_usage = 80

# Memory usage warning threshold (MB)
memory_warning_threshold = 4096

# Enable performance monitoring
performance_monitoring = yes

# Performance log interval (seconds)
performance_log_interval = 60

[Logging]
# Log level: debug, info, warning, error, critical
log_level = info

# Log file location
log_file = logs/server.log

# Enable log rotation
log_rotation = yes

# Log rotation size (MB)
log_rotation_size = 100

# Maximum log files to keep
log_max_files = 10

# Log to console
log_to_console = yes

# Separate error log
error_log_file = logs/error.log

[Maintenance]
# Enable maintenance mode
maintenance_mode = no

# Maintenance message
maintenance_message = Server is under maintenance. Please try again later.

# Allowed IPs during maintenance (comma-separated)
maintenance_allowed_ips = 127.0.0.1,192.168.1.100

# Scheduled restart time (HH:MM format, 24-hour)
scheduled_restart_time = 04:00

# Restart warning interval (seconds)
restart_warning_interval = 300
