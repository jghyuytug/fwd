# DNF Game Server - Authentication Backend Configuration
# Configures user authentication and session management

[Authentication]
# Authentication method: database, ldap, or hybrid
auth_method = database

# Session timeout (seconds)
session_timeout = 3600

# Maximum concurrent sessions per account
max_sessions_per_account = 1

# Allow multiple characters from same account
allow_multi_character = yes

# Password hashing algorithm: md5, sha256, bcrypt
password_hash_algorithm = bcrypt

# Bcrypt work factor (rounds)
bcrypt_rounds = 10

[Session Management]
# Session key length (bytes)
session_key_length = 32

# Session ID regeneration interval (seconds)
session_regeneration_interval = 600

# Idle session cleanup interval (seconds)
idle_cleanup_interval = 300

# Maximum failed login attempts before lockout
max_login_attempts = 5

# Account lockout duration (seconds)
lockout_duration = 900

[Security]
# Require secure connection for authentication
require_secure_connection = no

# Enable IP address validation
validate_ip_address = yes

# Allow IP address change during session
allow_ip_change = no

# Enable hardware ID validation (anti-multi-client)
hardware_id_validation = yes

# Enable GeoIP location tracking
geoip_validation = no

# Maximum allowed distance for IP location change (km)
max_location_distance = 500

[Rate Limiting]
# Login attempts per IP per minute
login_rate_limit = 10

# Account creation per IP per hour
account_creation_rate_limit = 3

# Enable CAPTCHA after failed attempts
enable_captcha = yes

# Failed attempts before CAPTCHA
captcha_threshold = 3

[Logging]
# Log successful logins
log_successful_logins = yes

# Log failed login attempts
log_failed_logins = yes

# Log session creation/destruction
log_session_events = yes

# Log IP address changes
log_ip_changes = yes

# Authentication log file
auth_log_file = logs/authentication.log
