# DNF Game Server - Database Configuration
# This file configures the 4 database connection pools

[Account Database]
host = localhost
port = 3306
database = df_account
username = df_user
password = change_me
charset = utf8
max_connections = 10
timeout = 30

[Character Database]
host = localhost
port = 3306
database = df_character
username = df_user
password = change_me
charset = utf8
max_connections = 20
timeout = 30

[Game Database]
host = localhost
port = 3306
database = df_game
username = df_user
password = change_me
charset = utf8
max_connections = 50
timeout = 30

[Log Database]
host = localhost
port = 3306
database = df_log
username = df_user
password = change_me
charset = utf8
max_connections = 10
timeout = 30

# Connection Pool Settings
[Pool]
# Minimum idle connections per pool
min_idle = 2

# Maximum wait time for connection (seconds)
max_wait = 10

# Connection health check interval (seconds)
health_check_interval = 60

# Reconnect on connection loss
auto_reconnect = yes

# Query timeout (seconds)
query_timeout = 30

# Enable query logging for debugging
query_logging = no
