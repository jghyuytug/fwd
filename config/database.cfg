# DNF游戏服务器数据库配置文件
# 格式: type,host,port,user,password,database,pool_size,timeout
#
# type:       数据库类型 (1=taiwan, 2=cain, 3=billing, 4=login, 5=guild)
# host:       数据库服务器地址
# port:       端口号
# user:       数据库用户名
# password:   数据库密码
# database:   数据库名称
# pool_size:  连接池大小 (建议3-10)
# timeout:    连接超时时间(秒, 建议5-30)
#
# 生产服务器信息: 192.168.200.131:3306
# 测试数据库使用 test_ 前缀以避免影响生产环境

